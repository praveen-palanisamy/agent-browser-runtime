name: pages

# Project site (GitHub Pages). Deploys only from `main` so it satisfies the
# default github-pages environment protection rule (Deployment branches =
# the default branch). Release publishes do not need a separate Pages run:
# `release.yml` bumps package.json on main, which already triggers this
# workflow; the site also reads the latest release from the GitHub API at
# runtime. Re-run manually via workflow_dispatch if needed.
#
# Enable once: Settings → Pages → Source: GitHub Actions.
# Keep Environments → github-pages → Deployment branches: default branch only
# (do not add tag rules — tags are not used for Pages deploys).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "package.json"
      - "scripts/site-build.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
