name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Fast gate: no browser, < 1 minute.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Playwright pin matches Dockerfile
        run: node scripts/check-playwright-pin.mjs
      - name: Build + pack check
        run: |
          npm run build
          npm run pack:check
      - name: Site builds
        run: npm run site:build

  # Real Chromium smoke: local provider + session round-trip.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser
      - name: CLI in-process job (same path the GitHub Action takes)
        env:
          AGENT_RUNNER_PACING: "false"
        run: |
          npm run build
          node dist/cli.js post --local --platform demo \
            --strategies examples/demo-strategy/index.js \
            --session examples/demo-strategy/session.json \
            --text "ci smoke" --session-out /tmp/refreshed.json --out /tmp/result.json
          test -s /tmp/refreshed.json
          node dist/cli.js probe --local --platform demo \
            --strategies examples/demo-strategy/index.js \
            --session examples/demo-strategy/session.json

  # The composite GitHub Action must work exactly as consumers use it
  # (`uses: praveen-palanisamy/agent-browser-runtime@v0`).
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Probe with the bundled demo strategy
        id: probe
        uses: ./
        with:
          command: probe
          platform: demo
          session-file: examples/demo-strategy/session.json
          pacing: "false"
      - name: Post with the bundled demo strategy
        id: post
        uses: ./
        with:
          command: post
          platform: demo
          session-file: examples/demo-strategy/session.json
          text: "hello from the ABR action"
          pacing: "false"
      - name: Assert outputs
        run: |
          test "${{ steps.probe.outputs.authenticated }}" = "true"
          test "${{ steps.post.outputs.ok }}" = "true"
          test -s "${{ steps.post.outputs.session-file }}"
          cat "${{ steps.post.outputs.result-file }}"

  # The published container image must at least build and answer /healthz.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agent-browser-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name abr -p 18080:8080 \
            -e AGENT_RUNNER_TOKEN=ci-smoke-token-0123456789 \
            -v "$PWD/examples/demo-strategy:/strategies:ro" \
            agent-browser-runtime:ci serve --strategies /strategies/index.js
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker logs abr
