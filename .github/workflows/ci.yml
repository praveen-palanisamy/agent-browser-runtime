name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Fast gate: no browser, < 1 minute.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Playwright pin matches Dockerfile
        run: node scripts/check-playwright-pin.mjs
      - name: Build + pack check
        run: |
          npm run build
          npm run pack:check

  # Real Chromium smoke: local provider + session round-trip.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser

  # The published container image must at least build and answer /healthz.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agent-browser-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name abr -p 18080:8080 \
            -e AGENT_RUNNER_TOKEN=ci-smoke-token-0123456789 \
            -v "$PWD/examples/demo-strategy:/strategies:ro" \
            agent-browser-runtime:ci serve --strategies /strategies/index.js
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz
          docker logs abr
