name: release

# Manual: bump version + changelog and commit to main. Do not tag here —
# tags pushed with GITHUB_TOKEN do not start other workflows, and tagging
# early would skip release-on-green's draft. After CI is green on this
# commit, release-on-green creates vX.Y.Z + a draft GitHub Release; you
# Publish that draft to fan out npm / GHCR / Pages / Marketplace.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
      - run: npm ci
      - name: Validate
        run: npm run ci:check
      - name: Bump version + changelog
        run: node scripts/release.mjs --bump=${{ inputs.bump }}
      - name: Commit + push (no tag)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push
